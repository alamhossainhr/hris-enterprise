<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Enterprise HRIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-buildings-fill text-primary display-5"></i>
            <h4 class="mt-2 fw-bold text-dark">ENTERPRISE HRIS</h4>
            <p class="text-muted small">Industrial RMG & Corporate Governance Portal</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password credentials.
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">Sign In to Workspace</button>
        </form>
    </div>
</body>
</html>
